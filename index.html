<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Otomo エオトモ - AIフォトフレーム</title>
    <style>
        :root {
            --primary-color: #2c3e50;    /* Dark blue-gray */
            --secondary-color: #95a5a6;  /* Light gray */
            --accent-color: #34495e;     /* Medium blue-gray */
            --background-color: #fafbfc;
            --surface-color: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-color: #e9ecef;
            --border-radius: 8px;
            --shadow-light: 0 2px 8px rgba(44, 62, 80, 0.08);
            --shadow-medium: 0 4px 16px rgba(44, 62, 80, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 32px;
            box-shadow: var(--shadow-medium);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin: 0 0 48px 0;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
        }
        .section {
            margin: 32px 0;
            padding: 24px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
        }

        .section h3 {
            color: var(--primary-color);
            margin: 0 0 20px 0;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .section ol {
            margin: 0;
            padding-left: 24px;
            color: var(--text-secondary);
        }

        .section li {
            margin-bottom: 8px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 4px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-light);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--secondary-color);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status {
            text-align: center;
            padding: 16px 24px;
            margin: 16px 0;
            border-radius: var(--border-radius);
            font-weight: 500;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .status.disconnected {
            background-color: #faf9f7;
            color: var(--text-secondary);
            border-color: var(--secondary-color);
        }

        .status.connected {
            background-color: #f8f9fa;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .status.sending {
            background-color: #f8f9fa;
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .instructions {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: var(--border-radius);
            margin: 32px 0;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
        }

        .instructions h3 {
            margin: 0 0 16px 0;
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 500;
        }

        .instructions ol {
            margin: 0;
            padding-left: 24px;
            color: var(--text-secondary);
        }

        .instructions li {
            margin-bottom: 8px;
        }

        .instructions p {
            margin: 16px 0 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .display-mode-selector {
            text-align: center;
            margin: 32px 0;
            padding: 24px;
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
        }

        .display-mode-selector h3 {
            margin: 0 0 20px 0;
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 500;
        }

        .mode-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .mode-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--surface-color);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 90px;
        }

        .mode-icon:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-light);
            transform: translateY(-2px);
        }

        .mode-icon.active {
            border-color: var(--primary-color);
            background-color: var(--background-color);
            box-shadow: var(--shadow-medium);
        }
        .mode-preview {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            justify-content: center;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid var(--border-color);
        }

        .mode-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .photo-controls {
            text-align: center;
            margin: 32px 0;
            padding: 24px;
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
        }

        .photo-controls h3 {
            margin: 0 0 20px 0;
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 500;
        }
        .preview-container {
            margin: 24px 0;
            text-align: center;
        }

        .preview-container h4 {
            margin: 0 0 16px 0;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: 500;
        }

        #previewCanvas {
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
            box-shadow: var(--shadow-light);
        }

        .render-mode-selector {
            text-align: center;
            margin: 20px 0;
            padding: 16px;
            background-color: var(--background-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .render-mode-selector h4 {
            margin: 0 0 12px 0;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: 500;
        }

        .render-mode-options {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .render-mode-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--surface-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            min-width: 75px;
            color: var(--text-primary);
        }

        .render-mode-btn:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-light);
        }

        .render-mode-btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }
        .progress-container {
            margin: 20px 0;
            padding: 20px;
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--accent-color) 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .compression-info {
            margin: 12px 0 0 0;
            padding: 12px;
            background-color: var(--background-color);
            border-radius: var(--border-radius);
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>e-Otomo エオトモ</h1>

        <div class="section" style="text-align: center; margin: 24px 0;">
            <p style="color: var(--text-secondary); margin: 0 0 12px 0;">オープンソースAIフォトフレーム</p>
            <a href="https://github.com/manomono-23/e-otomo" target="_blank"
               style="color: var(--primary-color); text-decoration: none; font-weight: 500; font-size: 14px;">
                GitHub で詳細を見る →
            </a>
        </div>

        <div id="browserInfo" style="margin-top: 15px; padding: 10px; border-radius: 5px; display: none;">
            <!-- Browser compatibility info will be inserted here dynamically -->
        </div>

        <!-- Display mode selector removed - auto-detected from device UUID -->
        
        <div class="photo-controls">
            <h3>写真を選択</h3>
            <div style="margin: 20px 0;">
                <input id="photoInput" type="file" accept="image/*" style="display:none" onchange="onPhotoSelected(event)" />
                <button onclick="document.getElementById('photoInput').click()">写真を選択</button>
            </div>

            <div id="previewArea" style="display: none;">
                <div class="render-mode-selector">
                    <h4>描画モード</h4>
                    <div class="render-mode-options">
                        <div class="render-mode-btn active" onclick="selectRenderMode('floyd-steinberg')" title="高品質なグラデーション">点描</div>
                        <div class="render-mode-btn" onclick="selectRenderMode('atkinson')" title="Mac風のソフトなディザ">ソフト</div>
                        <div class="render-mode-btn" onclick="selectRenderMode('ordered')" title="規則正しいパターン">パターン</div>
                        <div class="render-mode-btn" onclick="selectRenderMode('threshold')" title="クリアな輪郭">クリア</div>
                    </div>
                </div>
                <div class="preview-container">
                    <h4>プレビュー（自動正方形切り取り）</h4>
                    <canvas id="previewCanvas" width="200" height="200"></canvas>
                </div>
                <div class="progress-container" id="progressContainer">
                    <div class="compression-info" id="compressionInfo"></div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-text" id="progressText">準備中...</div>
                </div>
                <div id="status" class="status disconnected" style="margin: 20px 0;">
                    写真を選択してから接続してください
                </div>

                <div style="text-align: center; margin: 20px 0;">
                    <button id="connectBtn" onclick="connectToDevice()" disabled>デバイスに接続</button>
                </div>

                <div style="margin: 20px 0;">
                    <button id="sendBtn" onclick="sendImage()" disabled>送信</button>
                    <button onclick="resetPhoto()">新しい写真を選択</button>
                </div>
            </div>
        </div>

        <footer style="text-align: center; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border-color);">
            <p style="color: var(--text-secondary); font-size: 14px; margin: 0 0 8px 0;">
                e-Otomo は MIT License のもとでオープンソース公開されています
            </p>
            <div style="margin: 12px 0;">
                <a href="https://github.com/manomono-23/e-otomo" target="_blank"
                   style="color: var(--primary-color); text-decoration: none; margin: 0 12px; font-size: 14px;">
                    プロジェクトページ
                </a>
                <a href="https://github.com/manomono-23/e-otomo/issues" target="_blank"
                   style="color: var(--primary-color); text-decoration: none; margin: 0 12px; font-size: 14px;">
                    問題報告
                </a>
                <a href="https://github.com/manomono-23/e-otomo/blob/main/README.md" target="_blank"
                   style="color: var(--primary-color); text-decoration: none; margin: 0 12px; font-size: 14px;">
                    ドキュメント
                </a>
            </div>
        </footer>
    </div>

    <script>
        // WebBluetooth settings - UUIDs for different display types
        const DEVICE_NAME_SERVICE_UUID = '12345678-1234-5678-9abc-123456789abd';  // Legacy service for name-based detection
        const DEVICE_NAME_CHARACTERISTIC_UUID = '87654321-4321-8765-cba9-987654321abd';
        
        // Display-specific Service UUIDs for automatic color detection
        const DISPLAY_2COLOR_SERVICE_UUID = '11111111-2222-3333-4444-555555555555';
        const DISPLAY_3COLOR_SERVICE_UUID = '22222222-3333-4444-5555-666666666666';
        const DISPLAY_4COLOR_SERVICE_UUID = '33333333-4444-5555-6666-777777777777';
        
        // Unified Characteristic UUID for all display types (same as legacy)
        const DISPLAY_CHARACTERISTIC_UUID = '87654321-4321-8765-cba9-987654321abd';
        
        // Command types for nRF52840
        const COMMAND_TYPE = {
            DRAW_DATA: 0x01,
            RLE_COMPRESSED_DATA: 0x02,
            COMPRESSED_DATA: 0x03,
            STATUS_REQUEST: 0x04,
            SET_MODE: 0x05
        };
        
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let isConnected = false;
        
        // Photo processing settings
        let previewCanvas = null;
        let previewCtx = null;
        let originalImage = null;
        let displayMode = 4; // 2=2色, 3=3色, 4=4色 (default to 2-color)
        let currentServiceUUID = null;
        let currentCharacteristicUUID = null;
        let renderMode = 'floyd-steinberg'; // デフォルトの描画モード

        // Image data (200x200 pixels, variable bits per pixel based on mode)
        let imageData = new Uint8Array(10000); // Maximum size for 4-color mode
        const TARGET_SIZE = 200;
        
        // Initialize
        window.onload = function() {
            // Initialize preview canvas
            previewCanvas = document.getElementById('previewCanvas');
            if (previewCanvas) previewCtx = previewCanvas.getContext('2d');

            // Clear preview canvas
            if (previewCtx) {
                previewCtx.fillStyle = 'white';
                previewCtx.fillRect(0, 0, TARGET_SIZE, TARGET_SIZE);
            }

            updateStatus('写真を選択してから接続してください', 'disconnected');

            // Check WebBluetooth support and show appropriate info
            checkWebBluetoothSupport();

            // Display mode will be auto-detected when connecting to device
            displayMode = 4; // Default value, will be overridden
        };

        function checkWebBluetoothSupport() {
            const browserInfo = document.getElementById('browserInfo');

            // Check if user agent contains Bluefy (already working)
            if (navigator.userAgent.includes('Bluefy')) {
                browserInfo.style.display = 'none';
                return true;
            }

            // Check WebBluetooth support
            if (!navigator.bluetooth) {
                // WebBluetooth not supported
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

                if (isIOS) {
                    // iOS device - recommend Bluefy
                    browserInfo.innerHTML = `
                        <p><strong>WebBluetoothが利用できません</strong></p>
                        <p><strong>iOSをご利用の方:</strong> Safari等の標準ブラウザではWebBluetoothが利用できません。<br>
                        <a href="https://apps.apple.com/jp/app/bluefy-web-ble-browser/id1492822055" target="_blank" style="color: var(--primary-color); text-decoration: none;">
                        <strong>Bluefy - Web BLE Browser</strong></a> アプリをダウンロードしてご利用ください。</p>
                    `;
                    browserInfo.style.backgroundColor = 'var(--background-color)';
                    browserInfo.style.borderLeft = '4px solid var(--secondary-color)';
                } else {
                    // Other platforms - show general error
                    browserInfo.innerHTML = `
                        <p><strong>WebBluetoothが利用できません</strong></p>
                        <p>このブラウザはWebBluetoothに対応していません。<br>
                        Chrome、Edge、Operaなどの対応ブラウザをご利用ください。</p>
                    `;
                    browserInfo.style.backgroundColor = 'var(--background-color)';
                    browserInfo.style.borderLeft = '4px solid var(--accent-color)';
                }

                browserInfo.style.display = 'block';
                return false;
            }

            // WebBluetooth is supported
            browserInfo.style.display = 'none';
            return true;
        }

        function checkAndHideBrowserInfo() {
            // Legacy function - now calls the new comprehensive check
            return checkWebBluetoothSupport();
        }
        
        // Photo processing functions
        function onPhotoSelected(event) {
            console.log('onPhotoSelected called');
            const file = event.target.files[0];
            if (!file) {
                console.log('No file selected');
                return;
            }

            console.log('File selected:', file.name, file.type);

            const reader = new FileReader();
            reader.onload = function(e) {
                console.log('File loaded');
                const img = new Image();
                img.onload = function() {
                    console.log('Image loaded:', img.width, 'x', img.height);
                    originalImage = img;
                    processImageToSquare(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImageToSquare(img) {
            console.log(`Processing image: ${img.width}x${img.height}`);

            // Clear preview canvas
            previewCtx.fillStyle = 'white';
            previewCtx.fillRect(0, 0, TARGET_SIZE, TARGET_SIZE);

            // Calculate center crop area for square output
            const size = Math.min(img.width, img.height);  // Use the smaller dimension
            const cropX = (img.width - size) / 2;          // Center horizontally
            const cropY = (img.height - size) / 2;         // Center vertically

            console.log(`Square crop: ${size}x${size} from (${cropX}, ${cropY})`);

            // Draw the square-cropped image to preview canvas
            previewCtx.drawImage(
                img,
                cropX, cropY, size, size,          // Source: center square from original image
                0, 0, TARGET_SIZE, TARGET_SIZE     // Destination: full preview canvas
            );

            // Apply display mode quantization
            quantizeCanvasToDisplayMode();

            // Show preview area and enable connection
            document.getElementById('previewArea').style.display = 'block';
            updateUIForPhotoSelected();

            console.log('Image processed and preview updated');
        }

        function updateUIForPhotoSelected() {
            console.log('updateUIForPhotoSelected called');

            // Check WebBluetooth support before enabling connection
            const webBluetoothSupported = checkWebBluetoothSupport();
            console.log('WebBluetooth support:', webBluetoothSupported);

            if (webBluetoothSupported) {
                // Enable connect button and update status
                document.getElementById('connectBtn').disabled = false;
                updateStatus('写真が選択されました。デバイスに接続してください', 'disconnected');
                console.log('Connect button enabled');
            } else {
                // Keep connect button disabled if WebBluetooth not supported
                document.getElementById('connectBtn').disabled = true;
                updateStatus('WebBluetoothが利用できません', 'disconnected');
                console.log('Connect button disabled - no WebBluetooth support');
            }

            // Send button status depends on connection state
            if (!isConnected) {
                document.getElementById('sendBtn').disabled = true;
            }
        }

        function resetPhoto() {
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('photoInput').value = '';
            originalImage = null;

            // Reset UI state
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            updateStatus('写真を選択してから接続してください', 'disconnected');

            // If connected, disconnect
            if (isConnected) {
                disconnect();
            }
        }

        // Display mode is now auto-detected from device UUID
        // This function is kept for internal use only
        function setDisplayMode(mode) {
            displayMode = mode;
            console.log('Display mode auto-detected as:', displayMode, 'colors');
        }

        function selectRenderMode(mode) {
            renderMode = mode;
            console.log('Render mode changed to:', renderMode);

            // Update UI
            document.querySelectorAll('.render-mode-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.querySelector(`[onclick="selectRenderMode('${mode}')"]`);
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            // Re-apply quantization if preview is available
            const previewArea = document.getElementById('previewArea');
            if (previewCtx && originalImage && previewArea && previewArea.style.display !== 'none') {
                console.log('Re-applying quantization for render mode:', mode);
                // Re-process the image with new render mode
                processImageToSquare(originalImage);
            }
        }

        async function sendModeToDevice() {
            try {
                const modePacket = new Uint8Array(2);
                modePacket[0] = COMMAND_TYPE.SET_MODE;
                modePacket[1] = displayMode;

                await bluetoothCharacteristic.writeValue(modePacket);
                console.log('Mode sent to nRF52840:', displayMode);
                updateStatus(`モード設定完了: ${displayMode}色モード`, 'connected');
            } catch (error) {
                console.error('Failed to send mode:', error);
                updateStatus('モード設定に失敗しました', 'connected');
            }
        }
        
        // Compare data sizes and choose optimal compression
        function chooseOptimalCompression() {
            // Get raw image data size
            let rawDataSize;
            if (displayMode === 2) {
                rawDataSize = 5000; // 1 bit per pixel
            } else {
                rawDataSize = 10000; // 2 bits per pixel
            }

            // Get RLE compressed size
            const rleData = convertCanvasToRLE();
            const rleDataSize = rleData.length;

            console.log(`Data size comparison: Raw=${rawDataSize} bytes, RLE=${rleDataSize} bytes`);

            // Return the optimal choice
            if (rleDataSize < rawDataSize) {
                return {
                    useRLE: true,
                    rawSize: rawDataSize,
                    compressedSize: rleDataSize,
                    savings: ((rawDataSize - rleDataSize) / rawDataSize * 100).toFixed(1),
                    data: rleData
                };
            } else {
                return {
                    useRLE: false,
                    rawSize: rawDataSize,
                    compressedSize: rawDataSize,
                    savings: 0,
                    data: null
                };
            }
        }

        // Updated progress display functions
        function showProgress() {
            document.getElementById('progressContainer').style.display = 'block';
        }

        function hideProgress() {
            document.getElementById('progressContainer').style.display = 'none';
        }

        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        function showCompressionInfo(info) {
            const compressionDiv = document.getElementById('compressionInfo');
            // Hide compression info for cleaner UI
            compressionDiv.style.display = 'none';
        }

        // Send image function
        function sendImage() {
            if (!isConnected || !bluetoothCharacteristic) {
                alert('デバイスに接続してください');
                return;
            }

            if (!previewCtx) {
                alert('送信する画像がありません');
                return;
            }

            sendImageDataOptimized();
        }
        
        function updateStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function connectToDevice() {
            try {
                updateStatus('e-Otomoデバイスを検索中...', 'disconnected');

                console.log('Searching for e-Otomo devices...');

                // Search for e-Otomo devices by service UUID (automatic color detection)
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                  filters: [
                    { namePrefix: "e-Otomo" }
                  ],
                  optionalServices: [
                    DISPLAY_2COLOR_SERVICE_UUID,

        async function connectGattWithAutoDetection() {
            let lastErr = null;
            for (let i = 0; i < 3; i++) {
                try {
                    // Ensure clean state
                    try {
                        if (bluetoothDevice.gatt.connected) {
                            bluetoothDevice.gatt.disconnect();
                            await delay(200);
                        }
                    } catch (_) {}

                    const server = await bluetoothDevice.gatt.connect();

                    // Auto-detect display type by available services
                    let detectedMode = null;
                    let service = null;
                    let characteristic = null;

                    // Try to detect by service availability (priority: 4-color > 3-color > 2-color > legacy)
                    try {
                        service = await server.getPrimaryService(DISPLAY_4COLOR_SERVICE_UUID);
                        characteristic = await service.getCharacteristic(DISPLAY_CHARACTERISTIC_UUID);
                        detectedMode = 4;
                        console.log('Detected 4-color display by service UUID');
                    } catch (e) {
                        try {
                            service = await server.getPrimaryService(DISPLAY_3COLOR_SERVICE_UUID);
                            characteristic = await service.getCharacteristic(DISPLAY_CHARACTERISTIC_UUID);
                            detectedMode = 3;
                            console.log('Detected 3-color display by service UUID');
                        } catch (e) {
                            try {
                                service = await server.getPrimaryService(DISPLAY_2COLOR_SERVICE_UUID);
                                characteristic = await service.getCharacteristic(DISPLAY_CHARACTERISTIC_UUID);
                                detectedMode = 2;
                                console.log('Detected 2-color display by service UUID');
                            } catch (e) {
                                // Fall back to legacy service with device name detection
                                try {
                                    service = await server.getPrimaryService(DEVICE_NAME_SERVICE_UUID);
                                    characteristic = await service.getCharacteristic(DEVICE_NAME_CHARACTERISTIC_UUID);
                                    
                                    // Detect from device name for legacy devices
                                    const deviceName = bluetoothDevice.name || '';
                                    if (deviceName.includes('2C')) {
                                        detectedMode = 2;
                                    } else if (deviceName.includes('3C')) {
                                        detectedMode = 3;
                                    } else if (deviceName.includes('4C')) {
                                        detectedMode = 4;
                                    } else {
                                        detectedMode = 3; // Default for legacy devices
                                    }
                                    console.log('Legacy device detected with', detectedMode, 'colors from name:', deviceName);
                                } catch (e) {

        function convertCanvasToRLE() {
            // Get preview canvas image data
            const previewImageData = previewCtx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE);
            const pixels = previewImageData.data;

            // Convert to pixel values first
            const pixelValues = new Array(TARGET_SIZE * TARGET_SIZE);
            for (let y = 0; y < TARGET_SIZE; y++) {
                for (let x = 0; x < TARGET_SIZE; x++) {
                    const pixelIndex = y * TARGET_SIZE + x;
                    const rgbaIndex = pixelIndex * 4;

                    const r = pixels[rgbaIndex];
                    const g = pixels[rgbaIndex + 1];
                    const b = pixels[rgbaIndex + 2];

                    // Color mapping based on display mode
                    if (r < 128 && g < 128 && b < 128) {
                        pixelValues[pixelIndex] = 0x01; // Black (dark colors)
                    } else if (displayMode >= 4 && r > 200 && g > 200 && b < 100) {
                        pixelValues[pixelIndex] = 0x02; // Yellow (4-color only: high R+G, low B)
                    } else if (displayMode >= 4 && r > 200 && g < 100 && b < 100) {
                        pixelValues[pixelIndex] = 0x03; // Red (4-color: high R, low G+B)
                    } else if (displayMode === 3 && r > 200 && g < 100 && b < 100) {
                        pixelValues[pixelIndex] = 0x02; // Red (3-color: high R, low G+B)
                    } else {
                        pixelValues[pixelIndex] = 0x00; // White (default)
                    }
                }
            }

            // RLE compress the pixel data
            const compressed = [];
            let i = 0;
            while (i < pixelValues.length) {
                const currentPixel = pixelValues[i];
                let runLength = 1;

                // Count consecutive identical pixels (max 255)
                while (i + runLength < pixelValues.length &&
                       pixelValues[i + runLength] === currentPixel &&
                       runLength < 255) {
                    runLength++;
                }

                // Store as [length, value] pairs
                compressed.push(runLength);
                compressed.push(currentPixel);

                i += runLength;
            }

            return new Uint8Array(compressed);
        }

        function createRLEDataPacket(rleData) {
            // Create packet with RLE compressed data header
            // [0] Command Type (0x02 = RLE compressed data)
            // [1] Display mode
            // [2-3] Data length (16-bit)
            // [4...] RLE compressed data
            const packet = new Uint8Array(4 + rleData.length);
            packet[0] = COMMAND_TYPE.RLE_COMPRESSED_DATA; // RLE compressed data command
            packet[1] = displayMode; // Include display mode
            packet[2] = rleData.length & 0xFF; // Length low byte
            packet[3] = (rleData.length >> 8) & 0xFF; // Length high byte
            packet.set(rleData, 4);

            console.log(`Created RLE packet: ${packet.length} bytes (${rleData.length} compressed data)`);
            return packet;
        }

        // Multiple dithering algorithms for e-paper display

        // Ordered dithering using Bayer matrix
        function orderedDither(imageData, width, height, palette) {
            const data = imageData.data;

            // 4x4 Bayer matrix
            const bayerMatrix = [
                [0, 8, 2, 10],
                [12, 4, 14, 6],
                [3, 11, 1, 9],
                [15, 7, 13, 5]
            ];

            function findClosestColor(r, g, b) {
                let minDistance = Infinity;
                let closestColor = 0;

                for (let i = 0; i < palette.length; i++) {
                    const [pr, pg, pb] = palette[i];
                    const distance = Math.sqrt((r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestColor = i;
                    }
                }
                return closestColor;
            }

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const threshold = (bayerMatrix[y % 4][x % 4] / 16) * 255;

                    const r = Math.min(255, data[idx] + threshold - 128);
                    const g = Math.min(255, data[idx + 1] + threshold - 128);
                    const b = Math.min(255, data[idx + 2] + threshold - 128);

                    const colorIndex = findClosestColor(r, g, b);
                    const newColor = palette[colorIndex];

                    data[idx] = newColor[0];
                    data[idx + 1] = newColor[1];
                    data[idx + 2] = newColor[2];
                    data[idx + 3] = 255;
                }
            }

            return imageData;
        }

        // Atkinson dithering (Mac-style)
        function atkinsonDither(imageData, width, height, palette) {
            const data = imageData.data;

            function findClosestColor(r, g, b) {
                let minDistance = Infinity;
                let closestColor = 0;

                for (let i = 0; i < palette.length; i++) {
                    const [pr, pg, pb] = palette[i];
                    const distance = Math.sqrt((r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestColor = i;
                    }
                }
                return closestColor;
            }

            // Convert to working array
            const pixels = [];
            for (let y = 0; y < height; y++) {
                pixels[y] = [];
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    pixels[y][x] = {
                        r: data[idx],
                        g: data[idx + 1],
                        b: data[idx + 2]
                    };
                }
            }

            // Apply Atkinson dithering
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const oldPixel = pixels[y][x];
                    const colorIndex = findClosestColor(oldPixel.r, oldPixel.g, oldPixel.b);
                    const newPixel = palette[colorIndex];

                    // Calculate error
                    const errorR = oldPixel.r - newPixel[0];
                    const errorG = oldPixel.g - newPixel[1];
                    const errorB = oldPixel.b - newPixel[2];

                    // Set quantized pixel
                    pixels[y][x] = { r: newPixel[0], g: newPixel[1], b: newPixel[2] };

                    // Distribute error (Atkinson pattern)
                    const directions = [
                        [1, 0], [2, 0], [0, 1], [1, 1], [-1, 1], [0, 2]
                    ];

                    for (const [dx, dy] of directions) {
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            pixels[ny][nx].r = Math.max(0, Math.min(255, pixels[ny][nx].r + errorR / 8));
                            pixels[ny][nx].g = Math.max(0, Math.min(255, pixels[ny][nx].g + errorG / 8));
                            pixels[ny][nx].b = Math.max(0, Math.min(255, pixels[ny][nx].b + errorB / 8));
                        }
                    }
                }
            }

            // Convert back to ImageData
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    data[idx] = pixels[y][x].r;
                    data[idx + 1] = pixels[y][x].g;
                    data[idx + 2] = pixels[y][x].b;
                    data[idx + 3] = 255;
                }
            }

            return imageData;
        }

        // Floyd-Steinberg dithering for multi-color e-paper display
        function floydSteinbergDither(imageData, width, height, palette) {

                    const [pr, pg, pb] = palette[i];
                    const distance = Math.sqrt((r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestColor = i;
                    }
                }
                colorStats[closestColor]++; // Track color usage
                return closestColor;
            }
            
            // Convert to working array for error diffusion
            const pixels = [];
            for (let y = 0; y < height; y++) {
                pixels[y] = [];
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    pixels[y][x] = {
                        r: data[idx],
                        g: data[idx + 1], 
                        b: data[idx + 2]
                    };
                }

            // Apply Floyd-Steinberg dithering
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const oldPixel = pixels[y][x];
                    const colorIndex = findClosestColor(oldPixel.r, oldPixel.g, oldPixel.b);
                    const newPixel = palette[colorIndex];
                    
                    // Calculate quantization error
                    const errorR = oldPixel.r - newPixel[0];
                    const errorG = oldPixel.g - newPixel[1];
                    const errorB = oldPixel.b - newPixel[2];
                    
                    // Set the quantized pixel
                    pixels[y][x] = { r: newPixel[0], g: newPixel[1], b: newPixel[2] };

                    // Right pixel (7/16 of error)
                    if (x + 1 < width) {

                        pixels[y][x + 1].g = Math.max(0, Math.min(255, pixels[y][x + 1].g + errorG * 7 / 16));
                        pixels[y][x + 1].b = Math.max(0, Math.min(255, pixels[y][x + 1].b + errorB * 7 / 16));

                            pixels[y + 1][x - 1].g = Math.max(0, Math.min(255, pixels[y + 1][x - 1].g + errorG * 3 / 16));

                        pixels[y + 1][x].b = Math.max(0, Math.min(255, pixels[y + 1][x].b + errorB * 5 / 16));

                            pixels[y + 1][x + 1].g = Math.max(0, Math.min(255, pixels[y + 1][x + 1].g + errorG * 1 / 16));
                            pixels[y + 1][x + 1].b = Math.max(0, Math.min(255, pixels[y + 1][x + 1].b + errorB * 1 / 16));

                }

            for (let y = 0; y < height; y++) {

                palette = [
                    [255, 255, 255], // White
                    [0, 0, 0],        // Black
                    [255, 0, 0],      // Red
                    [255, 255, 0]     // Yellow
                ];
                console.log('Using 4-color palette with', palette.length, 'colors');
            }
            
            console.log('Selected palette:', palette);

            // Apply the selected rendering algorithm
            let processedData;
            switch (renderMode) {
                case 'floyd-steinberg':
                    processedData = floydSteinbergDither(previewImageData, TARGET_SIZE, TARGET_SIZE, palette);
                    break;
                case 'atkinson':
                    processedData = atkinsonDither(previewImageData, TARGET_SIZE, TARGET_SIZE, palette);
                    break;
                case 'ordered':
                    processedData = orderedDither(previewImageData, TARGET_SIZE, TARGET_SIZE, palette);
                    break;
                case 'threshold':
                    processedData = thresholdQuantize(previewImageData, TARGET_SIZE, TARGET_SIZE, palette);
                    break;
                default:
                    processedData = floydSteinbergDither(previewImageData, TARGET_SIZE, TARGET_SIZE, palette);
            }

            previewCtx.putImageData(processedData, 0, 0);

            console.log(`Applied ${renderMode} rendering for ${displayMode}-color e-paper conversion`);
        }
        
    </script>
